<style>
        body {
            background-color: #101010;
            color: #e5e2e1;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .xbox-focus:focus {
            outline: none;
            border-color: #107C10;
            box-shadow: 0 0 0 2px #107C10;
        }
        .tonal-step-1 { background-color: #181818; }
        .tonal-step-2 { background-color: #252525; }
        .tonal-input { background-color: #121212; border: 1px solid #252525; }
        
        /* Atmospheric background effect */
        .ambient-glow {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(16, 124, 16, 0.08) 0%, rgba(16, 124, 16, 0) 70%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<div class="ambient-glow"></div>
<!-- Header / TopAppBar (Context: Linear/Transactional) -->
<!-- Note: TopAppBar and BottomNavBar are suppressed for transactional flows per guidelines -->
<header class="w-full px-md py-lg max-w-container-max mx-auto flex justify-center">
<div class="flex items-center gap-base">
<div class="w-10 h-10 bg-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">sports_esports</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">GameCore</h1>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-base">
<div class="w-full max-w-[440px] tonal-step-1 rounded-xl overflow-hidden shadow-2xl transition-all duration-300">
<!-- Tabs -->
<div class="flex border-b border-surface-variant">
<button class="flex-1 py-md font-label-caps text-label-caps text-primary border-b-2 border-primary transition-all duration-200" id="loginTab">
                    Iniciar sesión
                </button>
<button class="flex-1 py-md font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-all duration-200" id="registerTab">
                    Registrarse
                </button>
</div>
<!-- Content Area -->
<div class="p-lg">
<!-- Login Form -->
<form class="space-y-md" id="authForm">
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant px-xs" for="email">Email</label>
<input class="w-full px-md py-base tonal-input rounded-lg text-body-md font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none text-on-surface" id="email" name="email" placeholder="nombre@ejemplo.com" required="" type="email"/>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Contraseña</label>
<a class="font-body-md text-body-md text-primary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
</div>
<input class="w-full px-md py-base tonal-input rounded-lg text-body-md font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex items-center gap-sm pt-xs">
<input class="w-5 h-5 rounded tonal-input text-primary-container focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Mantener sesión iniciada</label>
</div>
<button class="w-full py-md mt-base bg-primary-container text-on-primary-container font-headline-md text-headline-md font-bold rounded-lg hover:brightness-110 active:scale-[0.98] transition-all duration-200 xbox-focus" type="submit">
                        Continuar
                    </button>
</form>
<!-- Social Sign-In (Xbox dashboard inspired) -->
<div class="mt-lg">
<div class="relative flex items-center justify-center py-md">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-surface-variant"></div></div>
<span class="relative px-md bg-[#181818] font-label-caps text-label-caps text-on-surface-variant">O continúa con</span>
</div>
<div class="grid grid-cols-2 gap-md mt-md">
<button class="flex items-center justify-center gap-sm py-base tonal-step-2 rounded-lg font-body-md text-body-md hover:brightness-125 transition-all xbox-focus">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">account_circle</span>
                            Microsoft
                        </button>
<button class="flex items-center justify-center gap-sm py-base tonal-step-2 rounded-lg font-body-md text-body-md hover:brightness-125 transition-all xbox-focus">
<span class="material-symbols-outlined text-[#1DA1F2]" style="font-variation-settings: 'FILL' 1;">public</span>
                            Google
                        </button>
</div>
</div>
</div>
</div>
</main>
<!-- Footer from JSON -->
<footer class="w-full px-md py-lg mt-xl flex flex-col md:flex-row justify-between items-center border-t border-surface-variant bg-surface-container-low">
<div class="font-label-caps text-label-caps text-on-surface-variant mb-md md:mb-0">
            © 2024 GameCore Industries. All rights reserved.
        </div>
<nav class="flex flex-wrap justify-center gap-md">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors duration-200" href="#">Privacy Policy</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors duration-200" href="#">Terms of Service</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors duration-200" href="#">Contact Us</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors duration-200" href="#">Technical Support</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors duration-200" href="#">Global Sitemap</a>
</nav>
</footer>
<script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const authForm = document.getElementById('authForm');
        const forgotLink = document.querySelector('a[href="#"]');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('text-primary', 'border-primary', 'border-b-2');
            loginTab.classList.remove('text-on-surface-variant');
            registerTab.classList.add('text-on-surface-variant');
            registerTab.classList.remove('text-primary', 'border-primary', 'border-b-2');
            forgotLink.style.opacity = '1';
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('text-primary', 'border-primary', 'border-b-2');
            registerTab.classList.remove('text-on-surface-variant');
            loginTab.classList.add('text-on-surface-variant');
            loginTab.classList.remove('text-primary', 'border-primary', 'border-b-2');
            forgotLink.style.opacity = '0';
        });

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            // Micro-interaction: button pulse
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                btn.innerHTML = 'Continuar';
                alert('Funcionalidad de demostración. Los servicios de GameCore se están iniciando.');
            }, 1500);
        });

        // Atmosphere interaction
        document.addEventListener('mousemove', (e) => {
            const glow = document.querySelector('.ambient-glow');
            const x = (e.clientX / window.innerWidth) * 20 - 10;
            const y = (e.clientY / window.innerHeight) * 20 - 10;
            glow.style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body></html>

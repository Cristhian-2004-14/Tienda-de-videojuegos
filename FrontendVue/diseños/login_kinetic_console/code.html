<!-- Login Card -->
<div class="w-full surface-level-1 p-lg rounded-lg shadow-2xl border border-white/5 animate-in fade-in zoom-in-95 duration-500 delay-150">
<header class="mb-md text-center">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Bienvenido de nuevo</h1>
<p class="text-on-surface-variant text-body-md">Ingresa tus credenciales para acceder a Nexus Admin</p>
</header>
<form id="loginForm" class="space-y-md">
<!-- Username Field -->
<div class="flex flex-col space-y-xs group">
<label for="username" class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest px-xs">Username</label>
<div class="relative focus-ring rounded-DEFAULT transition-all">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input type="text" id="username" name="username" placeholder="nombre.usuario" class="w-full pl-xl pr-md py-sm bg-[#121212] border border-[#252525] rounded-DEFAULT text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:border-primary-container transition-colors duration-200" required="">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-xs group">
<div class="flex justify-between items-center px-xs">
<label for="password" class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Password</label>
</div>
<div class="relative focus-ring rounded-DEFAULT transition-all">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input type="password" id="password" name="password" placeholder="••••••••" class="w-full pl-xl pr-md py-sm bg-[#121212] border border-[#252525] rounded-DEFAULT text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:border-primary-container transition-colors duration-200" required="">
</div>
</div>

<div class="pt-sm space-y-md">
<button type="submit" class="w-full bg-primary-container hover:bg-[#158C15] text-white font-bold py-sm rounded-DEFAULT transition-all duration-200 active:scale-[0.98] btn-glow flex items-center justify-center space-x-sm">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
<div class="text-center">
<a href="#" class="text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200 underline-offset-4 hover:underline">

<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary-container/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30%] h-[30%] bg-primary-container/10 rounded-full blur-[100px]"></div>
</div>
<script>
        // Micro-interactions for login button
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Autenticando...</span>
            `;
            
            // Simulating API call
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span>Acceso Concedido</span>
                `;
                btn.classList.replace('bg-primary-container', 'bg-green-600');
                
                // Final transition could go here
                console.log("Form submitted. Navigating to dashboard...");
            }, 1500);
        });

        // Key-press interactions for focus states (Xbox style)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                document.body.classList.add('keyboard-nav');
            }
        });
    </script>

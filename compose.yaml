services:
  backend:
    build:
      context: ./BackendApi
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID}
      Firebase__ApiKey: ${FIREBASE_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontendVue
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
